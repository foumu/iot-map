<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>物联网地图与设备展示 Demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">IoT Campus Map</p>
          <h1>物联网地图与设备展示</h1>
        </div>

        <div class="topbar-actions" aria-label="地图操作">
          <button class="icon-button" id="zoom-out" type="button" aria-label="缩小" title="缩小">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
          </button>
          <button class="icon-button" id="zoom-in" type="button" aria-label="放大" title="放大">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button class="icon-button" id="reset-view" type="button" aria-label="重置视图" title="重置视图">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" /></svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="left-panel surface">
          <nav class="crumbs" id="breadcrumbs" aria-label="当前位置"></nav>

          <section>
            <div class="section-heading">
              <p class="eyebrow">对象</p>
              <strong id="scope-title">台湾 国立清华大学</strong>
            </div>
            <div id="scope-list" class="scope-list"></div>
          </section>

          <section id="floor-section" class="floor-section is-hidden">
            <div class="section-heading">
              <p class="eyebrow">楼层</p>
              <strong id="floor-title">楼层切换</strong>
            </div>
            <div id="floor-list" class="floor-list"></div>
          </section>

          <section class="detail-panel" aria-live="polite">
            <p class="eyebrow">详情</p>
            <div id="detail-content"></div>
          </section>
        </aside>

        <section class="stage-shell">
          <div class="stage-header surface">
            <div>
              <p class="eyebrow" id="stage-label">单位地图</p>
              <h2 id="stage-title">台湾 国立清华大学</h2>
            </div>
            <div class="status-summary" id="status-summary"></div>
          </div>

          <div class="stage surface" id="stage" aria-label="地图和平面图画布">
            <div class="floor-rail is-hidden" id="floor-rail"></div>
            <div class="viewport" id="viewport">
              <div class="scene" id="scene"></div>
            </div>
          </div>
        </section>

      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
